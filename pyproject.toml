[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-pack-bot"
version = "1.0.0"
description = "Automated 3D Game Asset Pack Generator"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Asset Pack Bot", email = "info@example.com"}
]
keywords = ["3d", "assets", "game-development", "procedural", "unity", "blender"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "pillow>=9.0.0",
    "numpy>=1.21.0",
    "requests>=2.28.0",
    "tqdm>=4.64.0",
    "jinja2>=3.1.0",
    "colorama>=0.4.6",
    "rich>=12.0.0",
]

[project.optional-dependencies]
ai = [
    "diffusers>=0.21.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "torch>=2.0.0",
    "safetensors>=0.3.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
asset-bot = "asset_bot.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/3dgamesassetpackbot"
Documentation = "https://github.com/yourusername/3dgamesassetpackbot#readme"
Repository = "https://github.com/yourusername/3dgamesassetpackbot"
Issues = "https://github.com/yourusername/3dgamesassetpackbot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
